<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Hello Docker</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #1e3c72, #2a5298);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
        }

        .card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            padding: 40px;
            border-radius: 20px;
            text-align: center;
            width: 350px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.3);
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 15px;
        }

        p {
            font-size: 1rem;
            margin-bottom: 25px;
            line-height: 1.5;
        }

        button {
            background: white;
            color: #2a5298;
            border: none;
            padding: 12px 24px;
            border-radius: 10px;
            font-size: 1rem;
            cursor: pointer;
            transition: 0.3s ease;
        }

        button:hover {
            background: #dbeafe;
            transform: scale(1.05);
        }

        .footer {
            margin-top: 20px;
            font-size: 0.85rem;
            opacity: 0.8;
        }
    </style>
</head>

<body>

    <div class="card">
        <h1>Hello Docker 🚀</h1>

        <p>
            This webpage is running inside a Docker container using NGINX.
            Pretty cool.
        </p>

        <button onclick="showMessage()">
            Click Me
        </button>

        <div class="footer">
            Created with HTML + CSS + Docker
        </div>
    </div>

    <script>
        function showMessage() {
            alert("Docker container is working successfully!");
        }
    </script>

</body>
</html>
